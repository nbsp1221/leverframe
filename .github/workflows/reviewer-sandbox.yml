name: Publish review sandbox template

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, scan, and publish template
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build template locally
        env:
          TEMPLATE_IMAGE: leverframe-review-sandbox:${{ github.sha }}
        run: infra/reviewer-sandbox/build.sh "${TEMPLATE_IMAGE}"

      - name: Run image smoke test
        env:
          TEMPLATE_IMAGE: leverframe-review-sandbox:${{ github.sha }}
        run: docker run --rm --entrypoint /usr/local/bin/leverframe-sandbox-smoke "${TEMPLATE_IMAGE}" image

      - name: Generate software inventory
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          format: cyclonedx
          image-ref: leverframe-review-sandbox:${{ github.sha }}
          output: reviewer-sandbox.cdx.json

      - name: Upload software inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: reviewer-sandbox-sbom-${{ github.sha }}
          path: reviewer-sandbox.cdx.json
          retention-days: 30

      - name: Scan template
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: '1'
          format: table
          ignore-unfixed: true
          image-ref: leverframe-review-sandbox:${{ github.sha }}
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Publish template
        env:
          LOCAL_IMAGE: leverframe-review-sandbox:${{ github.sha }}
          PUBLISHED_IMAGE: ghcr.io/${{ github.repository_owner }}/leverframe-review-sandbox:${{ github.sha }}
        run: |
          docker tag "${LOCAL_IMAGE}" "${PUBLISHED_IMAGE}"
          docker push "${PUBLISHED_IMAGE}"
          digest="$(docker inspect --format="{{index .RepoDigests 0}}" "${PUBLISHED_IMAGE}")"
          printf "### Immutable template\n\n\`%s\`\n" "${digest}" >> "${GITHUB_STEP_SUMMARY}"
